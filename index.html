<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' note-image: data: blob: https: http:; font-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'self'">
  <title>Calcite</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <script src="/appearance.js"></script>
  <style>
    html { background: var(--app-background, var(--ambient-base, Canvas)); }
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    body { margin: 0; }
    :root {
      --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
      --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      --safe-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
      --safe-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
    }
    :root[data-platform="mobile"] #app > footer,
    :root[data-platform="mobile"] .workspace > :is(.sidebar,.outline-panel) { display: none !important; }
    @media (max-width: 768px) {
      #app > footer, .workspace > :is(.sidebar,.outline-panel) { display: none !important; }
      .workspace { display: flex; flex-direction: column; }
    }
    #startup-status {
      position: fixed; right: calc(16px + var(--safe-right)); bottom: calc(38px + var(--safe-bottom)); z-index: 100;
      max-width: min(30rem, 80vw); padding: 10px 14px;
      border: 1px solid var(--border, ButtonBorder); border-radius: 8px;
      background: var(--surface-float-solid, Canvas); color: var(--text-primary, CanvasText); overflow-wrap: anywhere;
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
  </style>
</head>
<body>
  <div class="ambient-canvas" aria-hidden="true"></div>
  <div id="app" inert></div>
  <div id="startup-status" role="status">Calcite…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
