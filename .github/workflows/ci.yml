name: Calcite quality gates

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const tag='v'+require('./package.json').version; if(process.env.GITHUB_REF_NAME!==tag) throw new Error('Expected tag '+tag)"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx --no-install playwright install chromium
      - run: npm run verify:all
